name: UI Automation

permissions:
  contents: read
  pages: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        required: true
        default: qa
        options:
          - qa
          - dev
          - prod

      browser:
        description: Browser
        type: choice
        required: true
        default: chromium
        options:
          - chromium
          - firefox
          - webkit

      suite:
        description: Test Suite
        type: choice
        required: true
        default: regression
        options:
          - smoke
          - sanity
          - regression
          - all

concurrency:
  group: ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    name: UI Tests (${{ matrix.artifactName }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: "1/3"
            artifactName: shard-1

          - os: ubuntu-latest
            shard: "2/3"
            artifactName: shard-2

          - os: ubuntu-latest
            shard: "3/3"
            artifactName: shard-3

    env:
      CI: true
      ENV: ${{ github.event.inputs.environment }}
      BROWSER: ${{ github.event.inputs.browser }}
      SUITE: ${{ github.event.inputs.suite }}
      SHARD: ${{ matrix.shard }}

      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      # Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Cache Playwright Browsers
      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      # Install Dependencies
      - name: Install Dependencies
        run: npm ci

      # Clean Reports
      - name: Clean Reports
        run: npm run report:clean

      # Install Playwright Browsers
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # Type Check
      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # Generate Authentication
      - name: Generate Authentication
        run: npm run test:setup

      # Make Execute Script Executable
      - name: Make Execute Script Executable
        run: chmod +x .github/scripts/execute-ui.sh

      # Execute UI Tests
      - name: Execute UI Tests
        run: .github/scripts/execute-ui.sh

      # Upload Playwright Report
      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.artifactName }}
          path: playwright-report
          retention-days: 7
          if-no-files-found: warn

      # Upload Allure Results
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.artifactName }}
          path: allure-results
          retention-days: 7
          if-no-files-found: warn

      # Upload JSON Report
      - name: Upload JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: json-report-${{ matrix.artifactName }}
          path: test-results/results.json
          retention-days: 7
          if-no-files-found: warn

      # Upload Failed Test Results
      - name: Upload Failed Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-tests-${{ matrix.artifactName }}
          path: test-results
          retention-days: 7
          if-no-files-found: warn

      # Upload Trace Files
      - name: Upload Trace Files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.artifactName }}
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

  publish-allure:
    name: Publish Allure Report
    needs: ui-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: ${{ !cancelled() }}

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Download Allure Results
      - name: Download Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      # Restore Previous Report
      - name: Restore Previous Report
        run: |
          mkdir -p previous-report

          wget -q -r -np -nH \
            --cut-dirs=1 \
            --reject "index.html*" \
            "https://shalinibhagat2024-ops.github.io/UI-API_Playwright-Typescript-Framework_Design/" \
            -P previous-report || true

      # Restore History
      - name: Restore History
        run: |
          mkdir -p allure-results/history

          if [ -d previous-report/history ]; then
            cp -R previous-report/history/. allure-results/history/
          fi

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Install Allure CLI
      - name: Install Allure CLI
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.34.1/allure-2.34.1.tgz
          tar -xzf allure-2.34.1.tgz
          sudo mv allure-2.34.1 /opt/allure
          sudo ln -sf /opt/allure/bin/allure /usr/local/bin/allure

      # Generate Allure Report
      - name: Generate Allure Report
        if: always()
        run: |
          allure generate allure-results \
            --clean \
            --output allure-report

      # Setup GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # Upload GitHub Pages Artifact
      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      # Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
